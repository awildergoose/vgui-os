[package]
name = "vgui"
version = "0.1.0"
edition = "2024"

[dependencies]
limine = "0.6.5"
linked_list_allocator = "0.10.6"
pc-keyboard = "0.9.0"
ps2 = "0.2.0"
spin = "0.12.3"
x86_64 = "0.15.5"
bitflags = { version = "2.13.2", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "log", "medium-ethernet", "proto-dns", "proto-ipv4", "socket-dns", "socket-tcp"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
log = "0.4.35"
e1000-driver = "0.1.0"

[patch.crates-io]
ps2 = { path = "vendor/ps2" }
e1000-driver = { path = "vendor/e1000-driver" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
